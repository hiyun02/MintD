<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>MintD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.10/dist/sweetalert2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<style>
  @font-face {
    animation: motion 0.8s /* 속도 */
    linear 0s   /* 처음부터 끝까지 일정 속도로 진행 */
    infinite alternate; /* 무한 반복 */
    font-family: 'NIXGONM-Vb';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/NIXGONM-Vb.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
  *{
    font-family: 'NIXGONM-Vb';
  }
  p{
  }
  @keyframes motion {
  0% {margin-top: 0px;} /* 처음 위치 */
  100% {margin-top: 10px;} /* 마지막 위치 */
  }

</style>
<script th:inline="javascript">

  window.onload = function () {
    let msg = [[${msg}]];
    let url = [[${url}]];

    Swal.fire({
      title: '성공!',
      text: msg,
      icon: 'success',
      confirmButtonColor: '#58A581',
      timer: 0
    })

    location.href = url;
  };
</script>
<body>
<div class="container">
  <div class="row">
    <div class="col">
    </div>
    <div class="col" style="padding-top: 27%">
      <p style="color: #58A581; font-size: 38px; text-align: center;">당신의 일상을 자산으로</p>
      <div class="img" style="padding-left: 20%;"><img src="/assets/img/logo.png" style="width: 68%;"></div>

    </div>
    <div class="col">
    </div>
  </div>
</div>
</body>
</html>
