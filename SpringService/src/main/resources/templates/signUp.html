<head>
    <meta charset="UTF-8">
    <meta name="viewport"

    <title>회원가입</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- 자바스크립트에서 $ == 제이쿼리 문법을 쓸 수 있게 해주는 코드-->
    <script type="text/javascript">

        // HTML로딩이 완료되고, 실행됨
        $(document).ready(function () {

            let f = document.getElementById("f"); // form 태그

            // 아이디 중복체크
            $("#btnUserId").on("click", function () { // 버튼 클릭했을때, 발생되는 이벤트 생성함(onclick 이벤트와 동일함)
                userIdExists(f)

            })

            // 이메일 중복체크
            $("#btnEmail").on("click", function () { // 버튼 클릭했을때, 발생되는 이벤트 생성함(onclick 이벤트와 동일함)
                user_emailExists(f)

            })


        })


        // 회원아이디 중복 체크
        function userIdExists(f) {

            if (f.user_id.value === "") {
                alert("아이디를 입력하세요.");
                f.user_id.focus();
                return;
            }

            // Ajax 호출해서 아이디 중복체크
            $.ajax({
                    url: "/user/getUserIdExists",
                    type: "post", // 전송방식은 Post
                    dataType: "JSON", // 전송 결과는 JSON으로 받기
                    data: $("#f").serialize(), // form 태그 내 input 등 객체를 자동으로 전송할 형태로 변경하기
                    success: function (json) { // 호출이 성공했다면..

                        if (json.exists_yn === "Y") {
                            alert("이미 가입된 아이디가 존재합니다.");
                            f.user_id.focus();

                        } else {
                            alert("가입 가능한 아이디입니다.");
                            userIdCheck = "N";
                        }
                    }
                }
            )
        }

        // 이메일 중복 체크
        function user_emailExists(f) {
            if (f.user_email.value === "") {
                alert("이메일을 입력하세요.");
                f.user_email.focus();
                return;
            }

            $.ajax({
                    url: "/user/getUserEmailExists",
                    type: "post", // 전송방식은 Post
                    dataType: "JSON", // 전송 결과는 JSON으로 받기
                    data: $("#f").serialize(), // form 태그 내 input 등 객체를 자동으로 전송할 형태로 변경하기
                    success: function (json) { // 호출이 성공했다면..

                        if (json.exists_yn === "Y") {
                            alert("이미 가입된 이메일 주소가 존재합니다.");
                            f.user_email.focus();

                        } else {
                            alert("이메일로 인증번호가 발송되었습니다. \n받은 메일의 인증번호를 입력하기 바랍니다.");
                            emailAuthNumber = json.authNumber;

                        }

                    }
                }
            )
        }

        //회원가입 정보의 유효성 체크하기
        function doSubmit(f) {

            if (f.user_id.value === "") {
                alert("아이디를 입력하세요.");
                f.user_id.focus();
                return false;
            }

            if (f.user_pwd.value === "") {
                alert("비밀번호를 입력하세요.");
                f.user_pwd.focus();
                return false;
            }

            if (f.user_pwd2.value === "") {
                alert("비밀번호확인을 입력하세요.");
                f.user_pwd2.focus();
                return false;
            }

            if (f.user_pwd.value !== f.user_pwd2.value) {
                alert("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
                f.user_pwd.focus();
                return false;
            }

            if (f.user_email.value === "") {
                alert("이메일을 입력하세요.");
                f.user_email.focus();
                return false;
            }

            if (f.authNumber.value === "") {
                alert("이메일 인증번호를 입력하세요.");
                f.authNumber.focus();
                return false;
            }
            console.log("비교1" + f.authNumber.value);
            console.log("비교2" + emailAuthNumber);
            if (f.authNumber.value != emailAuthNumber) {
                alert("이메일 인증번호가 일치하지 않습니다.");
                f.authNumber.focus();
                return false;
            }

        }

    </script>
