<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>문의글 작성하기</title>
  <style>
    @font-face {
      font-family: 'Nanum Square';
      src: url('NanumSquareB.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body, h1, h2, h3, h4, h5, h6, p, a {
      font-family: 'Nanum Square', sans-serif;
    }

    body {
      align-items: center;
      margin: 0 auto; width: 650px; /*정중앙 배치에 필요한 속성 2개*/
    }

    .Q_title {
      width: 630px;
      height: 45px;
      border-radius: 3px;
      background-color: #58A581;
      box-shadow: 3px 4px 10px #C2C2C2;
      margin-bottom: 45px;
    }

    .Q_title .Q_text {
      font-size: 23px;
      color: #FFFFFF;
      padding: 10px 10px;
      text-align: center;
    }

    .Q_table {
      border: 1px solid #58A581;
      width: 620px;
      height: 420px;
      margin-bottom: 25px;
      border-collapse: collapse;  /* 테이블 셀간의 테두리 한 줄로 깔끔하게 */
      box-shadow: 3px 4px 10px #C2C2C2;
    }

    .Q_table th {
      background-color: #EEEEEE;
    }

    .Q_table th, .Q_table td {
      border: 1px solid #58A581;
      padding: 8px;
      height: 20px;  /* 이 속성 안 넣으면 th만 세로길이가 달라서 통일성을 위해 넣어줘야 함 */
    }

    .Q_cancel, .Q_register {
      display: inline-block;  /* 이걸 써야 둘이 한 줄에 나타남 안 쓰면 두 줄로 나타남 */
      border-radius: 25px;
      font-size: 20px;
      color: #FFFFFF;
      background-color: #58A581;
      width: 125px;
      height: 30px;
      padding: 4px 3px;
      text-align: center;
      line-height: 30px;     /* 글씨 조금 내려서 중앙에 위치하게 */
      box-shadow: 3px 4px 10px #C2C2C2;
    }

    .Q_cancel a, .Q_register a {
      color: #FFFFFF;
      text-decoration: none;
    }

    .Q_cancel {
      margin-left: 180px;
    }

    .Q_register {
      margin-right: 125px;
      margin-left: 10px;
    }

    #checkbox1 {
      border-radius: 25px;
      border: 1px solid #C2C2C2;
      padding-right: 200px;
      padding-top: 1px; /* 위쪽 패딩 값 지정 */
      padding-bottom: 1px; /* 아래쪽 패딩 값 지정 */
      padding-left: 8px; /
      margin-left: 5px;
      position: relative;  /* 위쪽으로 이동시키기 위해서는 `position` 속성을 사용해야 함 */
      top: -3px; /* 위쪽으로 3px 이동 */
      font-size: 12px;
      color: #C2C2C2;
      background-color: #FFFFFF;
      width: 300px;
      height: 40px;
      box-shadow: 1px 2px 3px #C2C2C2;
    }

    #checkbox2 {
      border-radius: 25px;
      border: 1px solid #C2C2C2;
      padding-right: 181px;
      padding-top: 1px; /* 위쪽 패딩 값 지정 */
      padding-bottom: 1px; /* 아래쪽 패딩 값 지정 */
      padding-left: 8px; /
      margin-left: 5px;
      position: relative;
      top: -2px;
      font-size: 12px;
      color: #C2C2C2;
      background-color: #FFFFFF;
      width: 300px;
      height: 40px;
      box-shadow: 1px 2px 3px #C2C2C2;
    }



  </style>
</head>
<body>
<div class="Q_title"><div class="Q_text">문의하기</div></div>

<table class="Q_table">
  <tr><th><input type="text" id="Q_title" placeholder="제목" style="text-align: center; width: 600px; height: 30px;"></th></tr>
  <tr><td><input type="text" id="Q_contents" placeholder="내용" style="text-align: center; width: 600px; height: 350px;"></td></tr>
</table>

<div class="checkbox">
  <input type="checkbox" id="report_check"><label for="report_check">&nbsp;<span id="checkbox1">답변 알림 받기</span></label>
<br>
  <input type="checkbox" id="secret_check"><label for="secret_check">&nbsp;<span id="checkbox2">비밀글로 작성하기</span></label>
</div>
<br><br>



<div class="Q_cancel"><a href="">취소</a></div><div class="Q_register"><a href="">등록</a></div>
</body>
</html>
