<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>로그인</title>
</head>
<style>
  @font-face {
    font-family: 'NIXGONM-Vb';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/NIXGONM-Vb.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
  *{
    font-family: 'NIXGONM-Vb';
  }
  @import url('https://rsms.me/inter/inter-ui.css');
  ::selection {
    background: #2D2F36;
  }
  ::-webkit-selection {
    background: #2D2F36;
  }
  ::-moz-selection {
    background: #2D2F36;
  }
  body {
    background: white;
    margin: 0;
    padding: 20px;
  }
  .page {
    background: #cae8db;
    display: flex;
    flex-direction: column;
    height: calc(100% - 40px);
    position: absolute;
    place-content: center;
    width: calc(100% - 40px);
  }
  @media (max-width: 767px) {
    .page {
      height: auto;
      margin-bottom: 20px;
      padding-bottom: 20px;
    }
  }
  .container {
    display: flex;
    height: 480px;
    margin: 0 auto;
    width: 870px;
  }
  @media (max-width: 767px) {
    .container {
      flex-direction: column;
      height: 630px;
      width: 320px;
    }
  }
  .left {
    background: white;
    height: calc(100% - 40px);
    top: 20px;
    position: relative;
    width: 70%;
  }
  @media (max-width: 767px) {
    .left {
      height: 100%;
      left: 20px;
      width: calc(100% - 40px);
      max-height: 270px;
    }
  }
  .login {
    font-size: 25px;
    color: #58A581;
    margin: 50px 40px 40px;
  }
  .eula {
    color: #838383;
    font-size: 20px;
    line-height: 1.5;
    margin: 40px;
  }
  .right {
    background: #58A581;
    box-shadow: 0px 0px 40px 16px rgba(159, 149, 149, 0.22);
    color: #F1F1F2;
    position: relative;
    width: 70%;
  }
  @media (max-width: 767px) {
    .right {
      flex-shrink: 0;
      height: 100%;
      width: 100%;
      max-height: 350px;
    }
  }
  svg {
    position: absolute;
    width: 320px;
  }
  path {
    fill: none;
    stroke: url(#linearGradient);;
    stroke-width: 4;
    stroke-dasharray: 240 1386;
  }
  .form {
    margin: 40px;
    position: absolute;
  }
  label {
    color: #fff;
    display: block;
    font-size: 15px;
    height: 16px;
    margin-top: 20px;
    margin-bottom: 5px;
  }
  input {
    background: transparent;
    border: 0;
    color: #f2f2f2;
    font-size: 20px;
    height: 30px;
    line-height: 30px;
    outline: none !important;
    width: 120%;
  }
  input::-moz-focus-inner {
    border: 0;
  }

  input::placeholder {
    color: #FFFFFF;
  }
  #submit {
    color: #ffffff;
    margin-top: 40px;
    transition: color 300ms;
  }
  #submit:focus {
    color: #f2f2f2;
  }
  #submit:active {
    color: #d0d0d2;
  }

</style>
<script>
  var current = null;
  document.querySelector('#user_id').addEventListener('focus', function(e) {
    if (current) current.pause();
    current = anime({
      targets: 'path',
      strokeDashoffset: {
        value: 0,
        duration: 700,
        easing: 'easeOutQuart'
      },
      strokeDasharray: {
        value: '240 1386',
        duration: 700,
        easing: 'easeOutQuart'
      }
    });
  });
  document.querySelector('#user_pwd').addEventListener('focus', function(e) {
    if (current) current.pause();
    current = anime({
      targets: 'path',
      strokeDashoffset: {
        value: -336,
        duration: 700,
        easing: 'easeOutQuart'
      },
      strokeDasharray: {
        value: '240 1386',
        duration: 700,
        easing: 'easeOutQuart'
      }
    });
  });
  document.querySelector('#submit').addEventListener('focus', function(e) {
    if (current) current.pause();
    current = anime({
      targets: 'path',
      strokeDashoffset: {
        value: -730,
        duration: 700,
        easing: 'easeOutQuart'
      },
      strokeDasharray: {
        value: '530 1386',
        duration: 700,
        easing: 'easeOutQuart'
      }
    });
  });
</script>
<body>
<div class="page">
  <div class="container">
    <div class="left">
      <div class="login">Login</div>
      <div class="eula">당신의 일상을 자산으로 만드는 <strong style="color: #58A581; font-size: 30px;">Mint D</strong></div>
    </div>
    <div class="right">
      <svg viewBox="0 0 320 300" style="width: 80%;">
        <defs>
          <linearGradient
                  collect="always"
                  id="linearGradient"
                  x1="13"
                  y1="193.49992"
                  x2="307"
                  y2="193.49992"
                  gradientUnits="userSpaceOnUse">
            <stop
                    style="stop-color:#98ffcf;"
                    offset="0"
                    id="stop876" />
            <stop
                    style="stop-color:#98ffcf;"
                    offset="0"
                    id="stop878" />
          </linearGradient>
        </defs>

        <path d="m 40,120.00016 239.99984,-3.2e-4 c 0,0 24.99263,0.79932 25.00016,35.00016 0.008,34.20084 -25.00016,35 -25.00016,35 h -239.99984 c 0,-0.0205 -25,4.01348 -25,38.5 0,34.48652 25,38.5 25,38.5 h 215 c 0,0 20,-0.99604 20,-25 0,-24.00396 -20,-25 -20,-25 h -190 c 0,0 -20,1.71033 -20,25 0,24.00396 20,25 20,25 h 168.57143" />
      </svg>
      <form class="login-form" method="post" action="/user/loginProc">
        <div class="form">
          <label for="user_id">&nbsp;아이디를 입력해주세요.</label>
          <input type="text" id="user_id" name="user_id"><br><br><br><br>
          <label for="user_pwd">&nbsp;비밀번호를 입력해주세요.</label>
          <input type="password" id="user_pwd" name="user_pwd">
          <input type="submit" id="submit" value="로그인" style="font-weight: bolder">
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
