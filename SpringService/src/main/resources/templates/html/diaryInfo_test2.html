    console.log("함수 실행 되었습니다!");

    const diary_seq =  [[${rDTO.diary_seq}]]

    $(document).ready(function () {
        // 버튼 클릭했을때, 발생되는 이벤트 생성함(onclick 이벤트와 동일함)
        $("#Like_up").on("click", function () {
            doSubmitLike(); // 좋아요수 증가 요청 전달 함수
        });

        $("#Like_up").on("click", function () {
            addLike(); // 버튼 색 변경 함수
        });

        $("#BookMark").on("click", function () {
            doSubmitBookMark(); // 북마크 추가 요청 전달 함수
        });

        $("#BookMark").on("click", function () {
            addBookMark(); // 북마크 추가 요청 전달 함수
        });
    });

    function doSubmitLike() {
        $.ajax({
            url: "/diary/updateLikeCnt",
            type: "post",
            dataType: "JSON",
            data: {
                'diary_seq': diary_seq
            }
        });
    };

    console.log("diary_seq : " + diary_seq);

    function addLike() {
        const pushHeartBtn = document.querySelector("#Like_up");
              pushHeartBtn.style.color ='#58a581';
    };

    function doSubmitBookMark() {
        $.ajax({
            url: "/diary/insertBookMark",
            type: "post",
            dataType: "JSON",
            data: {
                'diary_seq': diary_seq
            }
        });
    };

    function addBookMark() {
        const pushHeartBtn = document.querySelector("#BookMark");
        pushHeartBtn.style.color ='#58a581';
    };
    

    jQuery(document).ready(function ($) {

        $('#checkbox').change(function(){
            setInterval(function () {
                moveRight();
            }, 3000);
        });

        var slideCount = $('#slider ul li').length;
        var slideWidth = $('#slider ul li').width();
        var slideHeight = $('#slider ul li').height();
        var sliderUlWidth = slideCount * slideWidth;

        $('#slider').css({ width: slideWidth, height: slideHeight });

        $('#slider ul').css({ width: sliderUlWidth, marginLeft: - slideWidth });

        $('#slider ul li:last-child').prependTo('#slider ul');

        function moveLeft() {
            $('#slider ul').animate({
                left: + slideWidth
            }, 200, function () {
                $('#slider ul li:last-child').prependTo('#slider ul');
                $('#slider ul').css('left', '');
            });
        };

        function moveRight() {
            $('#slider ul').animate({
                left: - slideWidth
            }, 200, function () {
                $('#slider ul li:first-child').appendTo('#slider ul');
                $('#slider ul').css('left', '');
            });
        };

        $('a.control_prev').click(function () {
            moveLeft();
        });

        $('a.control_next').click(function () {
            moveRight();
        });

    });
