<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mint D | 키워드</title>
  <style>
    .centered-text {
      position: absolute;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2em;
      color: #58A581;
      z-index: 10;
      font-weight: 500;
    }

    body,
    html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      width: 500px;
      height: 450px;
      align-content: center;
      margin-bottom: 40px;
    }

    .button-container {
      display: flex;
      gap: 20px;
      margin-top: -30px;
    }

    .btn {
      padding: 12px 0;
      background-color: #ACEDCE;
      color: #58A581;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: background-color 0.3s, box-shadow 0.4s;
      font-size: 1.5em;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.4);
      width: 160px;
      text-align: center;
    }

    .btn:hover {
      background-color: #46825B;
      box-shadow: 0px 6px 8px rgba(0, 0, 0, 0.45);
    }

    .shape {
      width: 140px;
      height: 140px;
      margin: 28px 50px;
      transition: opacity 0.3s;
      background-color: #58A581;
      transform: rotate(45deg);
      border-radius: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
      font-size: 1.7em;
      cursor: pointer;
    }

    .shape img.logo {
      position: absolute;
      left: -7px;
      top: 90%;
      transform: translateY(-50%) rotate(-45deg);
      width: 32px;
      height: 32px;
      opacity: 1;
      cursor: pointer;
    }

    .editable {
      border: none;
      background: none;
      color: white;
      font-size: 1.0em;
      transform: rotate(-45deg);
      outline: none;
      cursor: pointer;
      width: 80px;
      padding: 0;
      border-bottom: 1px solid transparent;
      text-align: center;
    }

    .editable:focus {
      border-bottom: 1px solid white;
      cursor: text;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    @font-face {
      font-family: 'NIXGONM-Vb'; !important;
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/NIXGONM-Vb.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    *{
      font-family: 'NIXGONM-Vb';
    }


  </style>
</head>

<body>
<h1 class="centered-text">일기에 들어갈 키워드를 선택해 주세요.</h1>
<div class="container">
  <div class="shape">
    <img src="/assets/img/logo4.png" class="logo" onclick="hideShape(event)">
    <input type="text" class="editable" value="고양이" onclick="editText(event)">
  </div>
  <div class="shape">
    <img src="/assets/img/logo4.png" class="logo" onclick="hideShape(event)">
    <input type="text" class="editable" value="자전거" onclick="editText(event)">
  </div>
  <div class="shape">
    <img src="/assets/img/logo4.png" class="logo" onclick="hideShape(event)">
    <input type="text" class="editable" value="함께" onclick="editText(event)">
  </div>
  <div class="shape">
    <img src="/assets/img/logo4.png" class="logo" onclick="hideShape(event)">
    <input type="text" class="editable" value="행복" onclick="editText(event)">
  </div>
</div>

<div class="button-container">
  <button class="btn" onclick='location.href="/write/postWriting"'>완료</button>
  <button class="btn">직접입력</button>
</div>

<script>
  function hideShape(event) {
    if (event.target.classList.contains('logo')) {
      event.target.parentElement.classList.add('hidden');
    }
  }

  function editText(event) {
    event.stopPropagation();  // 부모 요소로의 이벤트 전파를 막음
    let input = event.target;
    input.focus();
  }
</script>
</body>

</html>
