<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 13</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }

    .outer-box {
      width: 370px;
      height: 370px;
      border: 2px solid #CAE1D6;
      background-color: #EAEAEA;
      border-radius: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
    }

    .inner-box {
      width: 160px;
      height: 160px;
      border: 1px solid #FFFFFF;
      background-color: #EEEEEE;
      border-radius: 20px;
      margin: 5px;
      position: relative;
    }

    .sca {
      width: 80px;
      height: 80px;
      display: block;
      margin: 10px auto 0;
    }

    .sca2 {
      width: 107px;
      height: 80px;
      display: block;
      margin: 10px auto 0;
    }

    .sca3 {
      width: 128px;
      height: 80px;
      display: block;
      margin: 10px auto 0;
    }

    .sca4 {
      width: 68px;
      height: 90px;
      display: block;
      margin: 10px auto 0;
    }

    .description {
      font-weight: bold;
      font-family: 'Nanum Square', sans-serif;
      text-align: center;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
    }

    .checkbox {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    @font-face {
      font-family: 'Nanum Square';
      src: url('NanumSquareB.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body, h1, h2, h3, h4, h5, h6, p, a {
      font-family: 'Nanum Square', sans-serif;
    }

    .center-top-text {
      color: #58A581;
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 45px;
    }

    .center-bottom-btn {
      font-family: 'Nanum Square', sans-serif;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.4);
      position: absolute;
      bottom: 20.5%;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 50px;
      border: none;
      border-radius: 25px;
      background-color: #ACEDCE;
      color: #58A581;
      cursor: pointer;
      font-size: 20px;
    }

    .center-bottom-btn:hover {
      background-color: #49976C;
      box-shadow: 0px 6px 8px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>

<body>
<div class="center-top-text">규격을 선택해주세요.</div>

<div class="outer-box">
  <div class="inner-box">
    <img class="sca" src="/assets/img/profile3.PNG" alt="설명1">
    <div class="description">1:1</div>
    <div class="checkbox">
      <input type="radio" name="boxChoice" id="choice1">
      <label for="choice1"></label>
    </div>
  </div>
  <div class="inner-box">
    <img class="sca2" src="/assets/img/profile3.PNG" alt="설명1">
    <div class="description">4:3</div>
    <div class="checkbox">
      <input type="radio" name="boxChoice" id="choice2">
      <label for="choice2"></label>
    </div>
  </div>
  <div class="inner-box">
    <img class="sca3" src="/assets/img/profile3.PNG" alt="설명1">
    <div class="description">5:8</div>
    <div class="checkbox">
      <input type="radio" name="boxChoice" id="choice3">
      <label for="choice3"></label>
    </div>
  </div>
  <div class="inner-box">
    <img class="sca4" src="/assets/img/profile3.PNG" alt="설명1">
    <div class="description">3:4</div>
    <div class="checkbox">
      <input type="radio" name="boxChoice" id="choice4">
      <label for="choice4"></label>
    </div>
  </div>
</div>

<button class="center-bottom-btn">선택</button>
</body>

</html>
